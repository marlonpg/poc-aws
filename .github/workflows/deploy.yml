name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/deploy.yml"
      - "infra/scripts/deploy.sh"

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: "17"
          cache: maven

      - name: Build jar
        working-directory: app
        run: ./mvnw -B clean package -DskipTests=false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload jar to S3
        id: upload
        run: |
          KEY="app/pocaws-${{ github.sha }}.jar"
          aws s3 cp app/target/pocaws-api.jar "s3://${{ vars.S3_BUCKET }}/${KEY}"
          echo "key=${KEY}" >> "$GITHUB_OUTPUT"

      - name: Trigger deploy via SSM
        id: ssm
        env:
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          S3_KEY: ${{ steps.upload.outputs.key }}
        run: |
          # Build the SSM commands array: two env exports followed by every
          # line of deploy.sh, each as its own JSON string element.
          PARAMS=$(jq -n \
            --arg bucket "$S3_BUCKET" \
            --arg key "$S3_KEY" \
            --rawfile script infra/scripts/deploy.sh \
            '{commands: (["export S3_BUCKET=" + $bucket, "export S3_KEY=" + $key] + ($script | split("\n")))}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy ${{ github.sha }}" \
            --parameters "$PARAMS" \
            --output text --query "Command.CommandId")

          echo "command_id=${COMMAND_ID}" >> "$GITHUB_OUTPUT"

      - name: Wait for deploy to finish
        run: |
          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${{ steps.ssm.outputs.command_id }}" \
              --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
              --query "Status" --output text 2>/dev/null || echo "Pending")

            echo "SSM command status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              exit 0
            fi
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              aws ssm get-command-invocation \
                --command-id "${{ steps.ssm.outputs.command_id }}" \
                --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
                --query "StandardErrorContent" --output text
              exit 1
            fi
            sleep 5
          done
          echo "Timed out waiting for SSM command"
          exit 1
